<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Festival - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black shadow-sm border-bottom border-warning border-opacity-25">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/index}">🍷 Epicentro Gourmet</a>
        <a th:href="@{/index}" class="btn btn-outline-warning btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3">
                <div class="card-header bg-black border-bottom border-warning border-opacity-25 py-3">
                    <h4 class="mb-0 fw-bold text-warning">🍽 Registrar Nuevo Festival</h4>
                    <small class="text-light opacity-75">Completa los datos del festival gastronómico</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/festival/save}" th:object="${festivalDTO}" method="post">

                        <div class="mb-3">
                            <label class="form-label text-warning fw-semibold">Nombre del Festival</label>
                            <input type="text" th:field="*{nombre}" class="form-control bg-dark text-light border-secondary" placeholder="Ej: epicentro food fest" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-warning fw-semibold">Temporada</label>
                            <input type="text" th:field="*{temporada}" class="form-control bg-dark text-light border-secondary" placeholder="Ej: Verano 2026" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-warning fw-semibold">Fecha Inicio</label>
                                <input type="date" th:field="*{fechaInicio}" class="form-control bg-dark text-light border-secondary" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-warning fw-semibold">Fecha Fin</label>
                                <input type="date" th:field="*{fechaFin}" class="form-control bg-dark text-light border-secondary" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-warning fw-bold py-2 shadow-sm">Guardar Festival</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <small class="text-light opacity-50">Hito 2 - Grupo 10 - OO2</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
