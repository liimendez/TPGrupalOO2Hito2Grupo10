<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking Recaudación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-black shadow-sm border-bottom border-warning border-opacity-25">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/index}">🍷 Epicentro Gourmet</a>
        <a th:href="@{'/festival/' + ${festival.id}}" class="btn btn-outline-warning btn-sm">← Volver al Festival</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card shadow-lg bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 mb-4">
        <div class="card-body p-4">
            <h1 class="fw-bold text-warning mb-1">🏆 Ranking Recaudación</h1>
            <p class="text-light opacity-75 mb-0" th:text="${festival.nombre} + ' - Temporada ' + ${festival.temporada}">epicentro food fest</p>
        </div>
    </div>

    <div class="card shadow bg-black bg-opacity-50 border border-warning border-opacity-25 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead class="bg-black text-warning">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>Unidad</th>
                        <th>Recaudación</th>
                        <th>Pedidos</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fila, stat : ${ranking}">
                        <td class="ps-4 fw-bold text-warning" th:text="${stat.index + 1}">1</td>
                        <td class="fw-bold text-light" th:text="${fila.nombre}">mc donalds - epicentro food fest</td>
                        <td class="text-warning fw-bold" th:text="'$ ' + ${#numbers.formatDecimal(fila.recaudacion, 1, 'POINT', 2, 'COMMA')}">$ 44.000,00</td>
                        <td><span class="badge bg-secondary" th:text="${fila.pedidos} + ' pedidos'">2 pedidos</span></td>
                    </tr>
                    <tr th:if="${ranking.isEmpty()}">
                        <td colspan="4" class="text-center text-light opacity-50 py-4">No hay pedidos aún</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
