<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mayor Canon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
<div class="container py-5">
    <h2 class="text-warning fw-bold">💰 Top <span th:text="${x}"></span> Mayor Canon - <span th:text="${festival.nombre}"></span></h2>
    <div class="card bg-black border border-warning border-opacity-25 mt-4">
        <table class="table table-dark table-striped mb-0">
            <thead><tr><th>#</th><th>Nombre Comercial</th><th>Código</th><th>Tipo</th><th>Canon</th></tr></thead>
            <tbody>
            <tr th:each="r, iter : ${reporte}">
                <td th:text="${iter.index + 1}"></td>
                <td class="text-warning fw-bold" th:text="${r.nombreComercial}"></td>
                <td th:text="${r.codigoUnico}"></td>
                <td><span class="badge bg-secondary" th:text="${r.tipoUnidad}"></span></td>
                <td>$ <span th:text="${#numbers.formatDecimal(r.canon,1,2)}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{'/festival/' + ${festival.id}}" class="btn btn-warning mt-4">← Volver al Detalle</a>
</div></body></html>
