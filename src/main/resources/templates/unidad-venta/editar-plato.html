<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar Plato</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
<div class="container py-5" style="max-width: 600px;">
    <!-- FIX: Volver dinámico según de donde vino -->
    <a th:href="${origen == 'mi-unidad'} ? @{/mi-unidad} : @{'/unidad-venta/' + ${plato.unidadVenta.id}}" class="btn btn-outline-warning btn-sm mb-4">← Volver a Mi Unidad</a>
    <div class="card bg-black border-warning border-opacity-50 shadow">
        <div class="card-body p-4">
            <h4 class="text-warning fw-bold mb-1">✏ Editar Plato</h4>
            <small class="text-white-50" th:text="${plato.nombre}">McNífica</small>
            <form th:action="@{'/unidad-venta/plato/editar/' + ${plato.id}}" method="post" class="mt-4">

                <!-- FIX: Hidden para saber de donde vino -->
                <input type="hidden" name="origen" th:value="${origen}" />

                <div class="mb-3">
                    <label class="form-label text-warning small fw-bold">Nombre del Plato</label>
                    <input type="text" name="nombre" th:value="${plato.nombre}" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-warning small fw-bold">Costo Prod. $</label>
                        <input type="number" step="0.01" name="costoProduccion" th:value="${plato.costoProduccion}" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-warning small fw-bold">Precio Venta $</label>
                        <input type="number" step="0.01" name="precioVenta" th:value="${plato.precioVenta}" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-warning small fw-bold">URL Imagen</label>
                    <input type="text" name="imagenUrl" th:value="${plato.imagenUrl}" placeholder="https://..." class="form-control bg-dark text-light border-warning border-opacity-50">
                    <div th:if="${plato.imagenUrl != null}" class="mt-2"><img th:src="${plato.imagenUrl}" style="width:80px; height:80px; object-fit:cover; border-radius:10px;"></div>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill">Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
