<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Plato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container py-5" style="max-width: 600px;">

    <a th:href="@{/mi-unidad}" class="btn btn-outline-warning btn-sm mb-4">← Volver a Mi Unidad</a>

    <div class="card bg-black border-warning border-opacity-50 shadow">
        <div class="card-body p-4">
            <h4 class="text-warning fw-bold mb-4">✏️ Editar Plato</h4>

            <form th:action="@{'/mi-unidad/plato/editar/' + ${plato.id}}" th:object="${plato}" method="post">

                <div class="mb-3">
                    <label class="form-label text-light opacity-75 small fw-bold">Nombre del Plato</label>
                    <input type="text" th:field="*{nombre}" class="form-control bg-white text-dark" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light opacity-75 small fw-bold">Precio Venta</label>
                    <input type="number" step="0.01" min="0" th:field="*{precioVenta}" class="form-control bg-white text-dark" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light opacity-75 small fw-bold">Costo Producción</label>
                    <input type="number" step="0.01" min="0" th:field="*{costoProduccion}" class="form-control bg-white text-dark" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Guardar Cambios</button>

            </form>
        </div>
    </div>

</div>

</body>
</html>
