<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${unidad.nombreComercial} + ' - Detalle'">Detalle UV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4" style="max-width: 900px;">
    <a href="/index" class="btn btn-sm btn-outline-warning rounded-pill mb-4">← Volver al Inicio</a>

    <div class="card rounded-4 p-4 mb-3" style="background: #2c2c2c; border: 1px solid #3d3d3d;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="text-warning fw-bold mb-0" th:text="${unidad.nombreComercial}">mc donalds</h2>
                <small class="text-white-50" th:text="${unidad.codigoUnico}">MC 8679004</small><br>
                <span th:if="${esCajero}" class="badge bg-warning text-dark mt-2">Vista PEDIDOS - Cajero</span>
                <span th:if="${esResponsable}" class="badge bg-info text-dark mt-2">Vista GESTIÓN - Responsable</span>
                <span th:if="${esAdmin && !esResponsable && !esCajero}" class="badge bg-secondary mt-2">Vista CATÁLOGO - Administrador (Solo lectura)</span>
            </div>
            <div class="d-flex gap-2">
                <div th:if="${esCajero}" class="d-flex gap-2">
                    <a th:href="@{'/pedido/new?unidadId=' + ${unidad.id}}" class="btn btn-warning rounded-pill fw-bold text-dark px-4">🛒 Hacer Pedido</a>
                    <a th:href="@{'/pedido/unidad/' + ${unidad.id}}" class="btn btn-outline-warning rounded-pill fw-bold px-4">📋 Ver Pedidos</a>
                </div>
                <a th:if="${esResponsable}" href="/empleado/listaEmpleado" class="btn btn-outline-warning rounded-pill fw-bold px-4">👥 Gestionar Empleados</a>
            </div>
        </div>
    </div>

    <div th:if="${esResponsable}" class="card rounded-4 p-3 mb-3" style="background: #2c2c2c; border: 1px solid #3d3d3d;">
        <form th:action="@{'/unidad-venta/' + ${unidad.id} + '/agregar-plato'}" method="post" class="row g-2">
            <div class="col-md-3"><input name="nombre" placeholder="Nombre plato" class="form-control form-control-sm" required></div>
            <div class="col-md-2"><input name="costoProduccion" type="number" step="0.01" placeholder="Costo" class="form-control form-control-sm" required></div>
            <div class="col-md-2"><input name="precioVenta" type="number" step="0.01" placeholder="Venta" class="form-control form-control-sm" required></div>
            <div class="col-md-3"><input name="imagenUrl" placeholder="URL imagen" class="form-control form-control-sm"></div>
            <div class="col-md-2"><button class="btn btn-sm btn-warning w-100 fw-bold">Agregar</button></div>
        </form>
    </div>

    <div class="card rounded-4 overflow-hidden" style="background: #2c2c2c; border: 1px solid #3d3d3d;">
        <div class="card-header">
            <span th:text="'Platos: ' + ${platos.size()} + ' - ' + ${unidad.nombreComercial}">Platos</span>
        </div>
        <div th:each="plato : ${platos}" class="d-flex gap-3 p-3 border-bottom border-secondary border-opacity-25 align-items-center">
            <img th:if="${plato.imagenUrl != null && !plato.imagenUrl.isEmpty()}" th:src="${plato.imagenUrl}" style="width:65px; height:65px; object-fit:cover; border-radius:12px; border:1px solid #ffc107;">
            <div th:if="${plato.imagenUrl == null || plato.imagenUrl.isEmpty()}" style="width:65px; height:65px; border-radius:12px; background:#1a1a1a; border:1px dashed rgba(255,193,7,0.3);" class="d-flex align-items-center justify-content-center fs-4">🍔</div>
            <div class="flex-grow-1">
                <div class="text-warning fw-bold" th:text="${plato.nombre}"></div>
                <div class="small text-white-50">Venta: $<span th:text="${plato.precioVenta}"></span></div>
            </div>
            <div class="d-flex gap-2">
                <a th:if="${esCajero}" th:href="@{'/pedido/new?unidadId=' + ${unidad.id} + '&platoId=' + ${plato.id}}" class="btn btn-sm btn-warning rounded-pill px-4 fw-bold">Pedir</a>
                <div th:if="${esResponsable}" class="d-flex gap-2">
                    <a th:href="@{'/unidad-venta/plato/editar/' + ${plato.id}}" class="btn btn-sm btn-outline-warning rounded-pill">Editar</a>
                    <form th:action="@{'/unidad-venta/' + ${unidad.id} + '/eliminar-plato/' + ${plato.id}}" method="post"><button class="btn btn-sm btn-outline-danger rounded-pill">Eliminar</button></form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
