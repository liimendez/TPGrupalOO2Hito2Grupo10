<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle UV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
<div class="container py-5">
    <a href="/index" class="btn btn-outline-warning btn-sm mb-4">← Volver</a>
    <div class="card bg-black border-warning mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h2 class="text-warning" th:text="${unidad.nombreComercial}"></h2>
                <p class="text-white-50 mb-0" th:text="${unidad.codigoUnico}"></p>
            </div>
            <a th:href="@{'/pedido/new/' + ${unidad.id}}" class="btn btn-warning">🛒 Hacer Pedido</a>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card bg-secondary bg-opacity-10">
                <div class="card-header text-warning">Agregar Plato</div>
                <div class="card-body">
                    <form th:action="@{'/unidad-venta/' + ${unidad.id} + '/agregar-plato'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />
                        <input name="nombre" class="form-control bg-dark text-light mb-3" placeholder="Big Mac" required>
                        <input name="precioVenta" type="number" step="0.01" class="form-control bg-dark text-light mb-3" placeholder="Precio" required>
                        <input name="costoProduccion" type="number" step="0.01" class="form-control bg-dark text-light mb-3" placeholder="Costo" required>
                        <button class="btn btn-warning w-100">Agregar</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card bg-secondary bg-opacity-10">
                <div class="card-header text-warning">Platos: <span th:text="${platos.size()}"></span> - Estás en <b th:text="${unidad.nombreComercial}"></b></div>
                <div class="card-body">
                    <div th:if="${platos.isEmpty()}" class="text-white-50">No hay platos</div>
                    <div th:each="p : ${platos}" class="d-flex justify-content-between align-items-center border-bottom border-secondary py-2">
                        <span class="text-warning" th:text="${p.nombre}"></span>
                        <span th:text="'$'+${p.precioVenta}"></span>
                        <div>
                            <a th:href="@{'/unidad-venta/' + ${unidad.id} + '/eliminar-plato/' + ${p.id}}" class="btn btn-sm btn-outline-danger me-1">X</a>
                            <a th:href="@{'/pedido/new/' + ${unidad.id}}" class="btn btn-sm btn-outline-warning">Pedir</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
