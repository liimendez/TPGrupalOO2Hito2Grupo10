<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cierre de Caja Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body.bg-dark{
            background: linear-gradient(rgba(26,29,35,0.88), rgba(26,29,35,0.92)), url('/img/fondo-gourmet.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
            background-repeat: no-repeat !important;
            background-color: #1a1d23 !important;
            min-height: 100vh;
        }
        .card-fest{
            box-shadow:0 0 40px rgba(0,0,0,.6), 0 0 0 1px rgba(250,204,21,.15);
            backdrop-filter: blur(12px);
            background: rgba(44,44,44,0.92) !important;
            border: 1px solid rgba(61,61,61,0.8);
        }
    </style>
</head>
<body class="bg-dark text-light">
<div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-lg rounded-4 p-4 card-fest">
        <div class="text-center mb-4">
            <h2 class="text-warning fw-bold mb-1"><i class="bi bi-cash-stack"></i> Cierre de Caja Diario</h2>
            <p class="text-white-50 small">Resumen de operaciones y recaudación del día</p>
        </div>

        <!-- Alerta si hay algún error (ej: cajero sin unidad) -->
        <div th:if="${error != null}" class="alert alert-danger border-0 rounded-3 mb-4" th:text="${error}"></div>

        <div th:if="${cierre != null}">
            <div class="mb-4">
                <ul class="list-group list-group-flush bg-transparent">
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between border-secondary py-3">
                        <span class="text-white-50">Fecha:</span>
                        <span class="fw-bold" th:text="${cierre.fecha}"></span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between border-secondary py-3">
                        <span class="text-white-50">Unidad de Venta:</span>
                        <span class="fw-bold text-warning" th:text="${cierre.nombreUnidad}"></span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between border-secondary py-3">
                        <span class="text-white-50">Cajero/a a cargo:</span>
                        <span class="fw-bold" th:text="${cierre.nombreCajero}"></span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between border-secondary py-3">
                        <span class="text-white-50">Total de Pedidos Realizados:</span>
                        <span class="badge bg-warning text-dark fs-6 px-3 rounded-pill" th:text="${cierre.cantidadPedidos}"></span>
                    </li>
                </ul>
            </div>

            <div class="p-4 rounded-4 text-center mb-4" style="background: rgba(0,0,0,0.4); border: 2px solid #28a745; box-shadow: 0 0 15px rgba(40,167,69,0.3);">
                <span class="text-uppercase text-white-50 small fw-bold tracking-wider">Total Recaudado Hoy</span>
                <h1 class="text-success fw-bold display-5 mt-1 mb-0">
                    $ <span th:text="${#numbers.formatDecimal(cierre.totalRecaudado, 1, 'POINT', 2, 'COMMA')}"></span>
                </h1>
            </div>
        </div>

        <div class="text-center mt-2">
            <a th:href="@{/index}" class="btn btn-warning fw-bold text-dark px-4 py-2 rounded-pill w-100 shadow-sm">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
