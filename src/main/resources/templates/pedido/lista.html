<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${unidadVenta.nombreComercial} + ' - Pedidos'">Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4" style="max-width: 900px;">
    <a href="/index" class="btn btn-sm btn-outline-warning rounded-pill mb-4">← Volver al Inicio</a>

    <div class="card rounded-4 p-4 mb-3 shadow" style="background: #2c2c2c; border: 1px solid #3d3d3d;">
        <h2 class="text-warning fw-bold mb-1" th:text="${unidadVenta.nombreComercial} + ' - ' + ${unidadVenta.codigoUnico}">mc donald - MC 5329003</h2>
        <span class="badge bg-warning text-dark fw-bold px-3 py-2" th:text="'Pedidos: ' + ${pedidos.size()}">Pedidos: 7</span>
    </div>

    <div class="card rounded-4 overflow-hidden shadow" style="background: #2c2c2c; border: 1px solid #3d3d3d;">
        <div th:if="${#lists.isEmpty(pedidos)}" class="p-5 text-center text-white-50">No hay pedidos aún.</div>

        <div th:each="pedido : ${pedidos}" class="d-flex justify-content-between align-items-center p-3 border-bottom" style="border-color: #3d3d3d !important;">
            <div>
                <div class="text-warning fw-bold" th:text="'Pedido #' + ${pedido.id} + ' - ' + ${pedido.fechaPedido}">Pedido #1</div>
                <div th:each="det : ${pedido.detalles}" class="text-white fw-semibold">
                    <span th:text="${det.plato.nombre}"></span>
                    <span class="text-warning" th:text="' x' + ${det.cantidad}"></span>
                    <span class="text-white-50" th:text="' - $' + ${det.plato.precioVenta}"></span>
                </div>
            </div>
            <div class="text-warning fw-bold fs-5" th:each="det : ${pedido.detalles}" th:text="'$' + ${det.plato.precioVenta * det.cantidad}"></div>
        </div>
    </div>

    <a th:href="@{/pedido/new}" class="btn btn-warning rounded-pill fw-bold text-dark px-4 py-2 mt-3">🛒 Nuevo Pedido</a>
</div>
</body>
</html>
