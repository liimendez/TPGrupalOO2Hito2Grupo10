<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#1a1d23!important}
        .ticket{background:#fefefe;color:#111;border-radius:12px;padding:22px;font-family:'Courier New',monospace;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:380px;min-width:320px}
        .ticket-header{border-bottom:2px dashed #111;padding-bottom:10px;margin-bottom:10px;text-align:center}
        .ticket-row{display:flex;justify-content:space-between;font-size:13px;margin:3px 0}
        .ticket-divider{border-top:2px dashed #111;margin:10px 0}
        .ticket-total{display:flex;justify-content:space-between;font-weight:bold;font-size:16px;margin-top:8px}
    </style>
</head>
<body class="bg-dark text-light">
<div class="container py-4">
    <a href="/index" class="btn btn-outline-warning btn-sm rounded-pill mb-4">Volver al Inicio</a>
    <div class="text-center mb-4">
        <h2 class="text-warning fw-bold" th:text="${unidadVenta.nombreComercial}"></h2>
        <span class="badge bg-warning text-dark rounded-pill" th:text="'Pedidos: ' + ${#lists.size(tickets)}"></span>
    </div>
    <div class="d-flex flex-wrap gap-4 justify-content-center">
        <div th:each="ticket : ${tickets}" class="ticket">
            <div class="ticket-header">
                <h6 class="fw-bold mb-1" th:text="${ticket.nombreFestival}" style="text-transform:uppercase"></h6>
                <small th:text="${ticket.nombreUnidad} + ' | ' + ${ticket.codigoUnico}"></small><br>
                <small th:text="'Ticket #' + ${ticket.id} + ' - ' + ${ticket.fechaPedido}"></small>
            </div>


            <div th:each="det : ${ticket.detalles}" class="ticket-row">
                <span th:text="${det.cantidad} + 'x ' + ${det.nombrePlato}"></span>
                <span th:text="'$' + ${det.subtotal}"></span>
            </div>

            <div class="ticket-divider"></div>
            <div class="ticket-total">
                <span>TOTAL</span>
                <span th:text="'$' + ${ticket.total}"></span>
            </div>
            <div class="text-center mt-3"><small>Gracias por su compra!</small></div>
        </div>
    </div>
    <div class="text-center mt-5">
        <a th:href="@{'/pedido/new?unidadId=' + ${unidadVenta.id}}" class="btn btn-warning fw-bold rounded-pill px-4">Nuevo Pedido</a>
    </div>
</div>
</body>
</html>
