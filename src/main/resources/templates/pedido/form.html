<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Nuevo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-5">
    <a th:href="@{'/unidad-venta/' + ${unidadVenta.id}}" class="btn btn-outline-warning btn-sm mb-4">← Volver a [[${unidadVenta.nombreComercial}]]</a>

    <div class="card bg-black border-warning mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h2 class="text-warning mb-1">Nuevo Pedido</h2>
            <p class="text-white-50">Estás pidiendo en: <b class="text-warning" th:text="${unidadVenta.nombreComercial}"></b> - <span th:text="${unidadVenta.codigoUnico}"></span></p>

            <hr class="border-secondary">

            <form th:action="@{/pedido/save}" method="post">
                <input type="hidden" name="unidadVentaId" th:value="${unidadVenta.id}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />

                <div class="mb-3">
                    <label class="form-label text-warning">Plato</label>
                    <select name="platoId" class="form-select bg-dark text-light border-secondary" required>
                        <option th:each="p : ${platos}" th:value="${p.id}" th:text="${p.nombre + ' - $' + p.precioVenta}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-warning">Cantidad</label>
                    <input type="number" name="cantidad" value="1" min="1" class="form-control bg-dark text-light border-secondary" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold">🛒 Guardar Pedido</button>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{'/unidad-venta/' + ${unidadVenta.id}}" class="text-white-50">Ver todos los platos de esta unidad</a>
    </div>
</div>
</body>
</html>
