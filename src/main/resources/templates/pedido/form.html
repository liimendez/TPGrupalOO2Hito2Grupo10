<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Nuevo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-5" style="max-width:600px;">
    <a th:href="@{'/unidad-venta/' + ${unidadVenta.id}}" class="btn btn-outline-warning btn-sm mb-4 rounded-pill">← Volver a [[${unidadVenta.nombreComercial}]]</a>

    <div class="card bg-black border-warning border-2 rounded-4">
        <div class="card-body p-4">
            <h2 class="text-warning fw-bold mb-1">Nuevo Pedido</h2>
            <p class="text-white-50">Estás pidiendo en: <b class="text-warning" th:text="${unidadVenta.nombreComercial} + ' - ' + ${unidadVenta.codigoUnico}"></b></p>
            <hr class="border-secondary">

            <form th:action="@{/pedido/save}" method="post">
                <input type="hidden" name="unidadVentaId" th:value="${unidadVenta.id}" />

                <div class="mb-3">
                    <label class="form-label text-warning fw-bold">Plato</label>
                    <select name="platoId" class="form-select bg-dark text-white border-secondary" required>
                        <option th:each="p : ${platos}" th:value="${p.id}" th:text="${p.nombre + ' - $' + p.precioVenta}" th:selected="${platoIdPreseleccionado != null && p.id == platoIdPreseleccionado}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-warning fw-bold">Cantidad</label>
                    <input type="number" name="cantidad" value="1" min="1" class="form-control bg-dark text-white border-secondary" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill">🛒 Guardar Pedido</button>
            </form>
        </div>
    </div>

    <div class="d-flex gap-2 justify-content-center mt-4">
        <a th:href="@{'/pedido/unidad/' + ${unidadVenta.id}}" class="btn btn-sm btn-outline-warning rounded-pill">📋 Ver Pedidos de esta unidad</a>
        <a th:href="@{'/unidad-venta/' + ${unidadVenta.id}}" class="text-white-50 btn btn-sm">Ver carta completa</a>
    </div>
</div>
</body>
</html>
