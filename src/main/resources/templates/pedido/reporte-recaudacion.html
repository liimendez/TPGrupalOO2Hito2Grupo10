<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Recaudación - Unidad de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Reporte de Recaudación</h3>
                </div>
                <div class="card-body">

                    <div class="mb-4 text-center">
                        <h4 class="text-muted">Unidad de Venta:</h4>
                        <h2 class="text-primary" th:text="${reporte.nombreFestival}">Nombre de la Unidad</h2>
                    </div>

                    <hr>

                    <div class="row text-center my-4">
                        <div class="col-md-6">
                            <div class="p-3 border bg-white rounded shadow-sm">
                                <h5>Recaudación Total</h5>
                                <h3 class="text-success" th:text="${'$ ' + #numbers.formatDecimal(reporte.recaudacionTotal, 1, 'DEFAULT', 2, 'DEFAULT')}">$ 0.00</h3>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 border bg-white rounded shadow-sm">
                                <h5>Cantidad de Pedidos</h5>
                                <h3 class="text-info" th:text="${reporte.cantidadPedidos}">0</h3>
                            </div>
                        </div>
                    </div>


                    <div class="text-center mt-4">
                        <a href="javascript:history.back()" class="btn btn-secondary">Volver</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
