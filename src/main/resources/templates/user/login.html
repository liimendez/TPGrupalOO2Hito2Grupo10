<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/img/favicon-llave.svg">
<title>Epicentro Gourmet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body{
            height: 100%;
            background: linear-gradient(rgba(26,29,35,0.85), rgba(26,29,35,0.9)), url('/img/fondo-gourmet.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
        }
        .login-card{
            background: rgba(44,44,44,0.95) !important;
            border: 2px solid #facc15 !important;
            box-shadow: 0 0 40px rgba(0,0,0,.7) !important;
            backdrop-filter: blur(12px);
            border-radius: 1.5rem !important;
        }
        .form-control{
            background: rgba(0,0,0,0.4) !important;
            border: 1px solid #3d3d3d !important;
            color: #fff !important;
        }
        .form-control:focus{
            border-color: #facc15 !important;
            box-shadow: 0 0 0 0.25rem rgba(250,204,21,.25) !important;
        }
        .btn-gold{
            background: #facc15 !important;
            color: #000 !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="login-card card p-0 overflow-hidden" style="max-width: 420px; width: 100%;">
    <div class="bg-black text-center py-4 border-bottom border-warning border-2">
        <h4 class="text-warning fw-bold mb-0">🍷 Epicentro Gourmet</h4>
        <small class="text-white-50">Grupo 10 - Acceso</small>
    </div>
    <div class="card-body p-4">
        <div th:if="${param.error}" class="alert alert-danger border-0 small py-2">Usuario o clave incorrecta</div>
        <div th:if="${param.logout}" class="alert alert-success border-0 small py-2">Te deslogueaste correctamente</div>
        <form th:action="@{/loginprocess}" method="post">
            <div class="mb-3">
                <label class="form-label text-warning fw-bold small">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="admin@admin.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-warning fw-bold small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-gold w-100 rounded-pill py-2">Entrar</button>
        </form>
        <div class="text-center mt-4">
            <a th:href="@{/index}" class="text-white-50 text-decoration-none small">← Volver al inicio</a>
        </div>
    </div>
</div>
</body>
</html>
