<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-secondary bg-opacity-10 border border-secondary border-opacity-25 shadow-lg p-4 rounded-3">
                <h2 class="h4 fw-bold text-warning mb-4 text-center">Editar Usuario ✏️</h2>

                <!-- CARTEL ROJO DE CORREO DUPLICADO -->
                <div th:if="${error}" class="alert alert-danger bg-danger text-white border-0 shadow-sm" role="alert">
                    <strong>⚠️ Error:</strong> <span th:text="${error}">No se puede usar ese correo, está en uso</span>
                </div>

                <form th:action="@{'/usuarios/editar/' + ${usuario.id}}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-light">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control bg-dark text-light border-secondary"
                               th:value="${usuario.correo}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Rol Actual</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               th:value="${usuario.rol.rol}" disabled>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/usuarios/lista}" class="btn btn-outline-light">Cancelar</a>
                        <button type="submit" class="btn btn-warning fw-semibold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
