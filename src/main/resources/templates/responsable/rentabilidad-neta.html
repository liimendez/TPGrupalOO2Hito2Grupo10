<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<title>Rentabilidad Neta - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#0f0f0f !important; color:#fff}
        .card-rentabilidad{border:2px solid #facc15;border-radius:16px;background:#fff;color:#111;box-shadow:0 0 30px rgba(250,204,21,.25)}
        .card-filtro{background:#1a1a1a !important; border:1px solid #333; border-radius:12px;}
    </style>
</head>
<body>
<div class="container py-5" style="max-width:700px">

    <div class="card card-filtro p-3 mb-4 text-white shadow">
        <form th:action="@{/festival/rentabilidad/fechas}" method="get" class="row g-2 align-items-center">
            <input type="hidden" name="festivalId" th:value="${festivalId}" />
            <input type="hidden" name="unidadVentaId" th:value="${unidadVentaId}" />

            <div class="col-md-4">
                <label for="desde" class="form-label small text-warning mb-1">Desde:</label>
                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                       id="desde" name="desde"
                       th:value="${desde}"
                       th:min="${festival.fechaInicio}"
                       th:max="${hasta != null ? hasta : festival.fechaFin}" required />
            </div>

            <div class="col-md-4">
                <label for="hasta" class="form-label small text-warning mb-1">Hasta:</label>
                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                       id="hasta" name="hasta"
                       th:value="${hasta}"
                       th:min="${desde != null ? desde : festival.fechaInicio}"
                       th:max="${festival.fechaFin}" required />
            </div>

            <div class="col-md-4 d-flex align-items-end mt-4">
                <button type="submit" class="btn btn-warning btn-sm fw-bold w-100 me-1">
                    <i class="bi bi-search me-1"></i> Filtrar
                </button>
                <a th:href="@{/festival/rentabilidad(festivalId=${festivalId}, unidadVentaId=${unidadVentaId})}"
                   class="btn btn-outline-light btn-sm" title="Restaurar fechas del festival">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </a>
            </div>
        </form>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card card-rentabilidad p-4">
        <h3 class="fw-bold mb-4 text-center"><i class="bi bi-calculator text-warning me-2"></i>Reporte de Rentabilidad Neta</h3>
        <hr>
        <div class="row mb-3">
            <div class="col-6">
                <h6 class="text-muted">Ganancia Bruta:</h6>
                <p class="fs-4 fw-bold text-primary" th:text="${'$' + rentabilidad.gananciaBruta}">$0.00</p>
            </div>
            <div class="col-6">
                <h6 class="text-muted">Total Sueldos:</h6>
                <p class="fs-4 fw-bold text-danger" th:text="${'- $' + rentabilidad.totalSueldos}">$0.00</p>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-6">
                <h6 class="text-muted">Canon:</h6>
                <p class="fs-4 fw-bold text-danger" th:text="${'- $' + rentabilidad.canon}">$0.00</p>
            </div>
            <div class="col-6">
                <h6 class="text-muted">Rentabilidad Neta Final:</h6>
                <p class="fs-3 fw-bold"
                   th:class="${rentabilidad.rentabilidadNeta < 0} ? 'fs-3 fw-bold text-danger' : 'fs-3 fw-bold text-success'"
                   th:text="${'$' + rentabilidad.rentabilidadNeta}">$0.00</p>
            </div>
        </div>
        <hr>
        <div class="text-end">
            <a th:href="@{/responsable/unidades}" class="btn btn-dark fw-bold px-4 py-2 rounded-pill">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
