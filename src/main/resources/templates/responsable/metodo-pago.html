<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/img/favicon-platos.svg">
    <title>Métodos de Pago - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="text-warning fw-bold mb-1"><i class="bi bi-credit-card-fill"></i> Gestión de Métodos de Pago</h3>
            <h6 class="text-white-50 mb-0">Administración de medios de cobro y descuentos</h6>
        </div>
        <a th:href="@{/index}" class="btn btn-outline-warning rounded-pill btn-sm"><i class="bi bi-arrow-left"></i> Volver al Inicio</a>
    </div>

    <p class="text-secondary small">
        ABM de Métodos de Pago
        <span class="badge bg-secondary ms-2" th:text="${metodosPago != null ? #lists.size(metodosPago) + ' métodos' : '0 métodos'}">0 métodos</span>
    </p>

    <!-- Mensaje de éxito/error -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulario -->
    <div class="card bg-secondary bg-opacity-10 border-secondary mb-4 shadow">
        <div class="card-header bg-transparent border-secondary">
            <h6 class="text-warning mb-0">
                <i class="bi bi-plus-circle-fill"></i>
                <span th:text="${metodoPago.id != null ? 'Modificar Método de Pago' : 'Nuevo Método de Pago'}">Nuevo Método de Pago</span>
            </h6>
        </div>
        <div class="card-body">
            <form th:action="@{/metodos-pago/guardar}" th:object="${metodoPago}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label form-label-sm text-secondary">Nombre del Método de Pago</label>
                        <input type="text" th:field="*{nombre}" class="form-control bg-dark text-light border-secondary" placeholder="Ej: Efectivo, Tarjeta, Mercado Pago..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label form-label-sm text-secondary">Descuento (%)</label>
                        <input type="number" step="0.01" min="0" max="100" th:field="*{descuentoPorcentaje}" class="form-control bg-dark text-light border-secondary" placeholder="Ej: 10.0" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-warning fw-bold w-100">
                            <i class="bi bi-check-lg"></i> <span th:text="${metodoPago.id != null ? 'Actualizar' : 'Guardar'}">Guardar</span>
                        </button>
                        <a th:if="${metodoPago.id != null}" th:href="@{/metodos-pago}" class="btn btn-outline-secondary" title="Cancelar edición">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card bg-dark border-secondary shadow overflow-hidden">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover mb-0 align-middle">
                <thead class="table-secondary bg-opacity-10">
                <tr>
                    <th class="text-secondary"><i class="bi bi-hash"></i> ID</th>
                    <th class="text-secondary"><i class="bi bi-credit-card"></i> Nombre</th>
                    <th class="text-secondary"><i class="bi bi-percent"></i> Descuento Aplicado</th>
                    <th class="text-secondary">Estado</th>
                    <th class="text-secondary text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="mp : ${metodosPago}" th:if="${mp != null and mp.id != null}">
                    <td><span class="badge bg-dark border" th:text="${mp.id}">1</span></td>
                    <td class="fw-semibold text-warning" th:text="${mp.nombre}">Efectivo</td>
                    <td>
                        <span class="badge bg-success bg-opacity-25 text-success border border-success" th:text="${mp.descuentoPorcentaje} + '%'">10%</span>
                    </td>
                    <td>
                        <span th:if="${mp.activo}" class="badge rounded-pill text-bg-success"><i class="bi bi-check-circle"></i> Activo</span>
                        <span th:if="${!mp.activo}" class="badge rounded-pill text-bg-danger"><i class="bi bi-x-circle"></i> Inactivo</span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{'/metodos-pago/editar/' + ${mp.id}}" class="btn btn-outline-warning rounded-pill me-1" title="Editar"><i class="bi bi-pencil"></i></a>
                            <a th:if="${mp.activo}" th:href="@{'/metodos-pago/eliminar/' + ${mp.id}}" class="btn btn-outline-danger rounded-pill" title="Dar de baja" onclick="return confirm('¿Desactivar este método de pago?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${metodosPago == null or #lists.isEmpty(metodosPago)}">
                    <td colspan="5" class="text-center text-secondary py-4">No hay métodos de pago cargados actualmente. ¡Agregá el primero arriba! 💳</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
