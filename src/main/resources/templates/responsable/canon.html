<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Canon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#c2c2c2 !important}
        .ticket{border:2px solid #111;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.25);background:#fff}
        .ticket-header{background:#111;border-bottom:4px solid #facc15}
        .line{background:#eeeeee;border:1px solid #d1d1d1;border-left:4px solid #facc15;border-radius:12px}
        .badge-amarillo{background:#facc15;color:#111;font-weight:800}
        .total-box{background:#111;border:2px solid #facc15;border-radius:16px}
        .btn-volver{background:#e5e5e5;border:1px solid #999;color:#111;font-weight:600}
    </style>
</head>
<body>
<div class="container py-4" style="max-width:720px">
    <a th:href="@{/responsable/unidades}" class="btn btn-volver rounded-pill mb-4"><i class="bi bi-arrow-left"></i> Volver</a>
    <div class="ticket">
        <div class="ticket-header p-4 text-white">
            <div class="d-flex justify-content-between">
                <span class="badge badge-amarillo rounded-pill px-3"><i class="bi bi-receipt"></i> COMPROBANTE</span>
                <span class="badge bg-white text-dark rounded-pill px-3" th:text="'ID: ' + ${detalle.unidadId}">ID: 1</span>
            </div>
            <h3 class="fw-bold mt-3 mb-1 text-white" th:text="'Canon - ' + ${detalle.nombreComercial}">Canon - Mc Donalds</h3>
            <small style="color:#a3a3a3">Detalle por participación</small>
            <div class="row g-2 mt-4">
                <div class="col-6"><div class="bg-white bg-opacity-10 border border-secondary rounded-3 p-3 text-center"><small class="text-secondary d-block">SUPERFICIE</small><span class="fw-bold text-warning" th:text="${detalle.superficieM2} + ' m²'">12.0 m²</span></div></div>
                <div class="col-6"><div class="bg-white bg-opacity-10 border border-secondary rounded-3 p-3 text-center"><small class="text-secondary d-block">DÍAS</small><span class="fw-bold text-warning" th:text="${detalle.diasFestival}">3</span></div></div>
            </div>
        </div>
        <div class="p-4" style="background:#fafafa">
            <div class="line p-3 d-flex justify-content-between mb-2">
                <div><i class="bi bi-rulers me-2"></i><strong>Costo Superficie</strong><br><small class="text-muted ms-4" th:text="${detalle.superficieM2} + ' × $500'">12 × $500</small></div>
                <span class="badge badge-amarillo rounded-pill px-3 py-2" th:text="'$' + ${detalle.costoSuperficieTotal}">$6000</span>
            </div>
            <div class="line p-3 d-flex justify-content-between mb-2">
                <div><i class="bi bi-tools me-2"></i><strong>Costo Montaje</strong></div>
                <span class="badge bg-dark text-warning border-warning rounded-pill px-3 py-2" th:text="'$' + ${detalle.costoMontaje}">$10</span>
            </div>
            <div class="line p-3 d-flex justify-content-between mb-3">
                <div><i class="bi bi-lightning-charge me-2 text-warning"></i><strong>Costo Electricidad</strong><br><small class="text-muted ms-4" th:text="${detalle.diasFestival} + ' × $2000'">3 × $2000</small></div>
                <span class="badge badge-amarillo rounded-pill px-3 py-2" th:text="'$' + ${detalle.costoElectricidad}">$6000</span>
            </div>
            <div class="total-box p-4 d-flex justify-content-between align-items-center">
                <div><small class="text-secondary text-uppercase">Total Canon</small><br><small style="color:#737373">a pagar</small></div>
                <span class="badge bg-warning text-dark px-4 py-3 fs-5 rounded-pill fw-bold" th:text="'$' + ${detalle.totalCanon}">$12010.000</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
