<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <title>Historial de Ventas Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{min-height:100vh;background:linear-gradient(rgba(15,15,15,.88), rgba(15,15,15,.93)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1920&auto=format&fit=crop') center / cover fixed;}
        .navbar-eg{background:#111;border-bottom:3px solid #facc15}
        .titulo{color:#fff;font-weight:800;font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
        .subtitulo{color:#facc15;font-weight:600}
        .card-historial{background:#fff;border:2px solid #facc15;border-radius:16px;padding:22px}
        .dato{background:#fef9c3;border-radius:10px;padding:12px;text-align:center;flex:1}
        .dato small{color:#854d0e;font-weight:700;font-size:11px;text-transform:uppercase;display:block}
        .dato b{color:#111;font-size:20px}
        .table thead{background:#111;color:#facc15}
        .table thead th{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}
        .btn-buscar{background:#facc15;color:#111;border:2px solid #111;font-weight:800;border-radius:10px;padding:8px 20px}
        .btn-limpiar{background:#fff;color:#111;border:2px solid #111;font-weight:800;border-radius:10px;padding:8px 20px;text-decoration:none}
    </style>
</head>
<body>
<nav class="navbar navbar-eg px-4 py-3">
    <span class="fw-bold text-white"><i class="bi bi-shop text-warning fs-5 me-2"></i>Epicentro Gourmet</span>
    <a href="/responsable/unidades" class="btn btn-outline-warning btn-sm rounded-pill fw-bold">← Mis Unidades</a>
</nav>
<div class="container py-5" style="max-width:900px">
    <h3 class="titulo text-center">📊 Historial de Ventas Diario</h3>
    <p class="subtitulo text-center mb-4" th:text="${unidad.nombreComercial} + ' - ' + ${festival.nombre}"></p>

    <div class="card-historial">
        <form method="get" action="/responsable/historial" class="row g-3 align-items-end mb-4">
            <input type="hidden" name="festivalId" th:value="${festival.id}">
            <input type="hidden" name="unidadVentaId" th:value="${unidad.id}">
            <div class="col-md-4">
                <label class="form-label fw-bold">Desde</label>
                <input type="date" name="desde" class="form-control" th:value="${desde}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Hasta</label>
                <input type="date" name="hasta" class="form-control" th:value="${hasta}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn-buscar"><i class="bi bi-search me-1"></i> Buscar</button>
                <a th:href="@{/responsable/historial(festivalId=${festival.id}, unidadVentaId=${unidad.id})}" class="btn-limpiar">Limpiar</a>
            </div>
        </form>

        <div class="d-flex gap-2 mb-3">
            <div class="dato"><small>Total general</small><b th:text="'$' + ${#numbers.formatDecimal(totalGeneral, 1, 2)}"></b></div>
            <div class="dato"><small>Total pedidos</small><b th:text="${totalPedidos}"></b></div>
            <div class="dato"><small>Días con ventas</small><b th:text="${#lists.size(historial)}"></b></div>
        </div>

        <div th:if="${#lists.isEmpty(historial)}" class="alert alert-warning text-center fw-bold">No hay ventas en ese rango de fechas.</div>

        <table th:if="${!#lists.isEmpty(historial)}" class="table table-hover align-middle">
            <thead><tr><th>Fecha</th><th>Cantidad de pedidos</th><th class="text-end">Total del día</th></tr></thead>
            <tbody>
            <tr th:each="v : ${historial}">
                <td class="fw-bold" th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy')}"></td>
                <td th:text="${v.cantidadPedidos} + ' pedidos'"></td>
                <td class="text-end fw-bold" th:text="'$' + ${#numbers.formatDecimal(v.totalDia, 1, 2)}"></td>
            </tr>
            </tbody>
            <tfoot><tr><th colspan="2" class="text-end">TOTAL</th><th class="text-end" th:text="'$' + ${#numbers.formatDecimal(totalGeneral, 1, 2)}"></th></tr></tfoot>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
