<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plato Estrella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container py-5">
    <a th:href="@{/responsable/unidades}" class="btn btn-outline-warning btn-sm mb-4">← Volver a Mis Unidades</a>

    <div class="card bg-black border-warning shadow mb-4">
        <div class="card-body">
            <h2 class="text-warning fw-bold" th:text="'Plato Estrella - ' + ${unidad.nombreComercial}">Plato Estrella</h2>
            <p class="text-light mb-0">Festival: <span class="text-light fw-bold" th:text="${festival.nombre}">Festival</span></p>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-warning" th:text="${error}">
        Mensaje de error
    </div>

    <div th:if="${platoEstrella != null}" class="card bg-black text-white border-warning shadow">
        <div class="card-header bg-warning text-dark fw-bold">
            🏆 Plato Más Vendido
        </div>
        <div class="card-body">
            <h3 class="card-title text-warning fw-bold" th:text="${platoEstrella.nombre}">Nombre del Plato</h3>
            <hr class="border-warning">

            <div class="row align-items-center">
                <div class="col-md-6">
                    <p class="mb-1"><strong>Precio de Venta:</strong> $<span th:text="${platoEstrella.precioVenta}">0.0</span></p>
                    <p class="mb-1"><strong>Costo de Producción:</strong> $<span th:text="${platoEstrella.costoProduccion}">0.0</span></p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <p class="mb-0 text-light small text-uppercase">Total Vendido</p>
                    <h2 class="text-warning fw-bold mb-0" th:text="${platoEstrella.cantidadVendida} + ' unidades'">0 unidades.</h2>
                </div>
            </div>

        </div>
    </div>

    <div th:if="${platoEstrella == null and error == null}" class="alert alert-dark border-secondary text-center py-4">
        ℹ️ Aún no hay pedidos registrados para esta unidad en este festival.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
