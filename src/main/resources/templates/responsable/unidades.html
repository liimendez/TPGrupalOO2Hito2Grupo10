<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Unidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#0f0f0f !important}
        .navbar-eg{background:#111;border-bottom:3px solid #facc15}
        .titulo{color:#fff !important;font-weight:800;letter-spacing:-.5px}
        .subtitulo{color:#facc15 !important;font-weight:600}
        .card-unidades{border:2px solid #facc15;border-radius:16px;overflow:hidden;box-shadow:0 0 30px rgba(250,204,21,.25);background:#fff}
        .table thead{background:#111;color:#facc15}
        .table thead th{font-weight:800;border:none;padding:14px 16px;text-transform:uppercase;font-size:13px;letter-spacing:1px;color:#facc15 !important}
        .table tbody td{color:#111;font-weight:600}
        .badge-id{background:#111;color:#facc15;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #facc15}
        .badge-sup{background:#facc15;color:#111;border:none;font-weight:800}
        .badge-tipo{background:#111;color:#facc15;border:2px solid #facc15;font-weight:800}
        .btn-ver{background:#facc15;color:#111;border:2px solid #111;font-weight:800;box-shadow:0 0 15px rgba(250,204,21,.6)}
        .btn-ver:hover{background:#fff;color:#111;border-color:#facc15;box-shadow:0 0 25px rgba(250,204,21,.8)}
    </style>
</head>
<body>
<nav class="navbar navbar-eg px-4 py-3">
    <span class="fw-bold text-white"><i class="bi bi-shop text-warning fs-5 me-2"></i>Epicentro Gourmet</span>
    <a href="/" class="btn btn-outline-warning btn-sm rounded-pill fw-bold">Inicio</a>
</nav>
<div class="container py-5" style="max-width:900px">
    <h3 class="titulo">Mis Unidades de Venta</h3>
    <p class="subtitulo small mb-4"><i class="bi bi-lightning-charge-fill me-1"></i> Unidades asignadas a tu usuario</p>
    <div class="card-unidades">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>ID</th><th>NOMBRE</th><th>SUPERFICIE</th><th>TIPO</th><th class="text-end">ACCIÓN</th></tr></thead>
                <tbody>
                <tr th:each="u : ${unidades}">
                    <td><span class="badge-id" th:text="${u.id}">1</span></td>
                    <td class="fw-bold" th:text="${u.nombreComercial}">mc donalds</td>
                    <td><span class="badge badge-sup rounded-pill px-3" th:text="${u.superficieM2} + ' m²'">12.0 m²</span></td>
                    <td><span class="badge badge-tipo rounded-pill px-3 py-2" th:text="${u.class.simpleName}">FoodTruck</span></td>
                    <td class="text-end"><a th:href="@{/responsable/canon/{id}(id=${u.id})}" class="btn btn-ver btn-sm rounded-pill px-4 py-2"><i class="bi bi-calculator me-1"></i> Ver Canon</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
