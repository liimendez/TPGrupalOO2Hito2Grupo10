<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#18181b; }
        .card { border:1px solid #3f3f46; }
    </style>
</head>
<body class="bg-dark">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card bg-zinc shadow-lg rounded-4" style="background:#27272a;">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h3 class="text-warning fw-bold mb-0"><i class="bi bi-person-gear me-2"></i>Editar empleado</h3>
                        <span class="badge bg-warning text-dark fs-6" th:text="${nuevoEmpleado.tipoPersonal}">CAJERO</span>
                    </div>
                    <p class="text-secondary small mb-4" th:text="'ID #' + ${empleadoId} + ' • Editando a ' + ${nuevoEmpleado.nombre} + ' ' + ${nuevoEmpleado.apellido}">ID #6</p>

                    <form th:action="@{/empleado/editar/{id}(id=${empleadoId})}" th:object="${nuevoEmpleado}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small text-uppercase">Nombre</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small text-uppercase">Apellido</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{apellido}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small text-uppercase">DNI</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-card-text"></i></span>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{dni}" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small text-uppercase">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control bg-dark text-white border-secondary" th:field="*{email}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small text-uppercase">Fecha Nacimiento</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" th:field="*{fechaNacimiento}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small text-uppercase">Fecha Ingreso</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" th:field="*{fechaIngreso}">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small text-uppercase">Tipo</label>
                                <select class="form-select bg-dark text-warning fw-bold border-warning" th:field="*{tipoPersonal}" required>
                                    <option value="CAJERO">CAJERO</option>
                                    <option value="COCINERO">COCINERO</option>
                                    <option value="LAVAPLATOS">LAVAPLATOS</option>
                                    <option value="AYUDANTE">AYUDANTE</option>
                                </select>
                                <small class="text-secondary">Cambia de CAJERO a LAVAPLATOS / AYUDANTE</small>
                            </div>
                        </div>

                        <div class="d-grid d-md-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-warning fw-bold flex-fill"><i class="bi bi-check-lg me-1"></i> Guardar cambios</button>
                            <a href="/empleado/listaEmpleado" class="btn btn-outline-light flex-fill"><i class="bi bi-arrow-left me-1"></i> Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
