<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empleados - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="text-warning fw-bold mb-1"><i class="bi bi-people-fill"></i> Gestión de Empleados</h3>
            <h6 class="text-white-50 text-capitalize mb-0" th:text="${unidad?.nombreComercial}">unidad</h6>
        </div>
        <a href="/" class="btn btn-outline-warning rounded-pill btn-sm"><i class="bi bi-arrow-left"></i> Volver al Inicio</a>
    </div>

    <p class="text-secondary small">
        ABM de empleados - <span th:text="${unidad?.nombreComercial}" class="text-capitalize">unidad</span>
        <span class="badge bg-secondary ms-2" th:text="${#lists.size(empleados)} + ' empleados'">1 empleado</span>
    </p>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card bg-secondary bg-opacity-10 border-secondary mb-4 shadow">
        <div class="card-header bg-transparent border-secondary">
            <h6 class="text-warning mb-0"><i class="bi bi-person-plus-fill"></i> Nuevo Empleado</h6>
        </div>
        <div class="card-body">
            <form th:action="@{/empleado/agregar}" th:object="${nuevoEmpleado}" method="post">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label form-label-sm text-secondary">Nombre</label>
                        <input th:field="*{nombre}" class="form-control bg-dark text-light border-secondary" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label form-label-sm text-secondary">Apellido</label>
                        <input th:field="*{apellido}" class="form-control bg-dark text-light border-secondary" placeholder="Apellido" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label form-label-sm text-secondary">DNI</label>
                        <input th:field="*{dni}" class="form-control bg-dark text-light border-secondary" placeholder="DNI" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label form-label-sm text-secondary">Email</label>
                        <input th:field="*{email}" type="email" class="form-control bg-dark text-light border-secondary" placeholder="email@ejemplo.com" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label form-label-sm text-warning">Fecha Nacimiento</label>
                        <input th:field="*{fechaNacimiento}" type="date" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label form-label-sm text-warning">Fecha Ingreso</label>
                        <input th:field="*{fechaIngreso}" type="date" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label form-label-sm text-secondary">Tipo</label>
                        <select id="selectTipo" th:field="*{tipoPersonal}" class="form-select bg-dark text-light border-secondary" onchange="toggleCategoria()">
                            <option value="CAJERO">CAJERO</option>
                            <option value="COCINERO">COCINERO</option>
                        </select>
                    </div>
                    <div class="col-md-2" id="divTurno">
                        <label class="form-label form-label-sm text-secondary">Turno</label>
                        <select th:field="*{turno}" class="form-select bg-dark text-light border-secondary">
                            <option value="MANIANA">MAÑANA</option>
                            <option value="NOCHE">NOCHE</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="divCategoria" style="display:none;">
                        <label class="form-label form-label-sm text-warning">Categoría Cocina</label>
                        <select th:field="*{categoria}" class="form-select bg-dark text-warning border-warning">
                            <option value="EJECUTIVO">CHEF EJECUTIVO - $150k</option>
                            <option value="AYUDANTE">AYUDANTE - $100k</option>
                            <option value="LAVAPLATOS">LAVAPLATOS - $50k</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-warning fw-bold px-4"><i class="bi bi-plus-lg"></i> Agregar Empleado</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card bg-dark border-secondary mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/empleado/lista}" method="get" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label text-warning small"><i class="bi bi-search"></i> Buscar Empleados</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" name="filtro" th:value="${filtro}" class="form-control bg-dark text-light border-secondary" placeholder="Nombre, apellido, DNI o mail...">
                    </div>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-warning fw-bold w-50"><i class="bi bi-funnel"></i> Filtrar</button>
                    <a th:href="@{/empleado/lista}" class="btn btn-outline-secondary w-50"><i class="bi bi-x-circle"></i> Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card bg-dark border-secondary shadow overflow-hidden">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover mb-0 align-middle">
                <thead class="table-secondary bg-opacity-10">
                <tr>
                    <th class="text-secondary"><i class="bi bi-hash"></i> ID</th>
                    <th class="text-secondary"><i class="bi bi-envelope"></i> Correo</th>
                    <th class="text-secondary"><i class="bi bi-person"></i> Nombre</th>
                    <th class="text-secondary">Rol / Categoría</th>
                    <th class="text-secondary">Estado</th>
                    <th class="text-secondary text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empleados}" th:if="${e != null and e.id != null}">
                    <td><span class="badge bg-dark border" th:text="${e.id}">1</span></td>
                    <td class="fw-semibold" th:text="${e.credenciales != null ? e.credenciales.correo : 'sin correo'}">mail</td>
                    <td th:text="${e.nombre + ' ' + e.apellido}">Nombre</td>
                    <td>
                        <span class="badge rounded-pill text-bg-warning bg-opacity-25 text-warning border border-warning" th:text="${e.class.simpleName}">CAJERO</span>
                        <span th:if="${e.class.simpleName == 'Cocinero'}" class="badge rounded-pill bg-secondary ms-1" th:text="${e.categoriaCocina != null ? e.categoriaCocina.nombre : 'SIN CAT'}">LAVAPLATOS</span>
                    </td>
                    <td>
                        <span th:if="${e.activo}" class="badge rounded-pill text-bg-success"><i class="bi bi-check-circle"></i> Activo</span>
                        <span th:if="${!e.activo}" class="badge rounded-pill text-bg-danger"><i class="bi bi-x-circle"></i> Inactivo</span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{'/empleado/editar/' + ${e.id}}" class="btn btn-outline-warning rounded-pill me-1" title="Editar"><i class="bi bi-pencil"></i></a>
                            <a th:if="${e.activo}" th:href="@{/empleado/liquidar/{id}(id=${e.id})}" class="btn btn-warning rounded-pill me-1 fw-bold" title="Liquidar sueldo + canon">$</a>
                            <a th:href="@{/empleado/liquidaciones/{id}(id=${e.id})}" class="btn btn-outline-info rounded-pill me-1" title="Historial"><i class="bi bi-receipt"></i></a>
                            <form th:if="${e.activo}" th:action="@{/empleado/eliminar/{id}(id=${e.id})}" method="post" class="d-inline">
                                <button class="btn btn-outline-danger rounded-pill me-1" title="Baja"><i class="bi bi-trash"></i></button>
                            </form>
                            <form th:if="${!e.activo}" th:action="@{/empleado/reactivar/{id}(id=${e.id})}" method="post" class="d-inline">
                                <button class="btn btn-success rounded-pill me-1" title="Alta"><i class="bi bi-arrow-up-circle"></i> Alta</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function toggleCategoria(){
        var tipo = document.getElementById('selectTipo').value;
        var esCocinero = tipo === 'COCINERO';
        document.getElementById('divCategoria').style.display = esCocinero ? 'block' : 'none';
        document.getElementById('divTurno').style.display = esCocinero ? 'none' : 'block';
    }
    document.addEventListener('DOMContentLoaded', toggleCategoria);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
