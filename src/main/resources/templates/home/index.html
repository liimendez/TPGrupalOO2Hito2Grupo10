<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Epicentro Gourmet - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<!-- Barra de navegación -->
<nav class="navbar navbar-dark bg-black shadow-sm border-bottom border-warning border-opacity-25">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/index}">
            🍷 Epicentro Gourmet
        </a>
        <div>
            <span class="text-warning me-3" th:if="${username != 'anonymous'}" th:text="'Usuario: ' + ${username}"></span>
            <a th:if="${username == 'anonymous'}" class="btn btn-outline-warning btn-sm" th:href="@{/login}">Iniciar Sesión</a>
            <a th:if="${username != 'anonymous'}" class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<!-- Contenido Principal -->
<div class="container py-5">
    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h1 class="h3 fw-bold text-warning">Festivales Gastronómicos 🍽️</h1>
            <p class="text-light opacity-75 mb-0">Listado de festivales registrados en el sistema</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a th:href="@{/unidad-venta/new}" class="btn btn-warning fw-semibold shadow-sm">
                Registrar Unidad de Venta
            </a>
        </div>
    </div>

    <!-- Festivales -->
    <div class="card shadow-lg bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${festivales != null and !festivales.isEmpty()}">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead class="bg-black text-warning border-bottom border-warning border-opacity-25">
                    <tr>
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Nombre</th>
                        <th class="py-3 px-4">Temporada</th>
                        <th class="py-3 px-4">Fecha Inicio</th>
                        <th class="py-3 px-4">Fecha Fin</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="festival : ${festivales}">
                        <td class="px-4 text-muted" th:text="${festival.idFestival}"></td>
                        <td class="px-4 fw-bold text-warning" th:text="${festival.nombre}"></td>
                        <td class="px-4" th:text="${festival.temporada}"></td>
                        <td class="px-4 text-light opacity-75" th:text="${festival.fechaInicio}"></td>
                        <td class="px-4 text-light opacity-75" th:text="${festival.fechaFin}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-5 text-center text-light" th:if="${festivales == null or festivales.isEmpty()}">
                No hay festivales cargados actualmente en el sistema.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
